<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapple</title>
  <script src="script.js" defer type="module"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
</head>
<body>
  <img src="assets/background.png" id="background">
  <img src="assets/fruitbox apple.png" id="apple">
  <img src = "assets/foreground.png" id="foreground">
  <img src = "assets/fruitbox apple selected.png" id="apple-selected">
  <div id="viewport">
    <div id="above">
      <p>Mapple</p>
      <div id="sound-control">
        <label for="mute-music">Music</label>
        <input type="checkbox" id="mute-music" checked>
        <input type="range" id="volume" min="0" max="1" value="1" step="0.01">
        
      </div>
    </div>
    <canvas id="canvas" width="1440" height="940">Fruit box game.</canvas>
    <div class="button-container">
      <div id="filtered">Filtered</div>
      <button id="switch">Switch</button>
      <div id="classic">Classic</div>
    </div>
  </div>
</body>
</html>
